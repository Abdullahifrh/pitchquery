[pytest]
testpaths = tests
python_files = test_*.py
markers =
    live_rag: hits the real Groq API and the real Neon database - excluded by default, opt in with -m live_rag
    extra: exploratory live_rag checks not required for a normal run - opt in with -m "live_rag and extra"
addopts = -m "not live_rag"
filterwarnings =
    ignore::DeprecationWarning:certifi.*